<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obsync</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="note-shell">
      <header class="topbar">
        <div>
          <strong>Obsync</strong>
          <span id="connection">Falta token</span>
        </div>
        <button id="settingsToggle" title="Conexión" aria-expanded="false">Conectar</button>
      </header>

      <section class="source">
        <span id="videoTitle">Abre una página o video</span>
        <strong id="range">Sin recorte</strong>
      </section>

      <textarea id="userNote" placeholder="Escribe la idea que quieres guardar de este momento..."></textarea>

      <section class="status-row" aria-label="Estado del apunte">
        <button class="status-pill active" data-status="pendiente">Pendiente</button>
        <button class="status-pill" data-status="revisado">Revisado</button>
      </section>

      <section class="capture-dock">
        <button id="screenshotBtn" title="Captura de pantalla">Imagen</button>
        <button id="noteBtn" class="primary">Guardar apunte</button>
        <button id="clipBtn">Iniciar extracto</button>
      </section>

      <section class="frames">
        <div>
          <span>Capturas</span>
          <strong id="screenshotCount">0</strong>
        </div>
        <div id="screenshotStrip" class="strip"></div>
      </section>

      <section id="transcriptPreview" class="preview" hidden>
        <div>
          <span>Último extracto</span>
          <strong id="transcriptRange"></strong>
        </div>
        <p id="captureSummary"></p>
        <pre id="transcriptText"></pre>
      </section>

      <section id="settingsPanel" class="settings" hidden>
        <label>
          Carpeta destino
          <select id="folderSelect"></select>
        </label>
        <div class="connection-tools">
          <button id="testConnectionBtn">Probar Obsidian</button>
          <span id="connectionDetail">Sin probar</span>
        </div>
        <label>
          Token de Obsidian
          <input id="obsidianToken" type="password" placeholder="Local REST API token" />
        </label>
        <label>
          Carpetas
          <input id="folders" value="Inbox, Learning, Ideas, Frameworks, Examples" />
        </label>
        <button id="saveSettingsBtn">Guardar conexión</button>
        <details class="advanced-settings">
          <summary>Avanzado</summary>
          <label>
            Backend
            <input id="backendUrl" value="http://localhost:4177" />
          </label>
          <label>
            Obsidian REST URL
            <input id="obsidianUrl" value="https://127.0.0.1:27124" />
          </label>
        </details>
      </section>

      <p id="message" aria-live="polite"></p>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
