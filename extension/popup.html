<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Obsync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>YouTube Obsync</strong>
        <span id="connection">Not configured</span>
      </header>

      <section class="status-card">
        <span id="videoTitle">Open a YouTube video</span>
        <strong id="range">No clip</strong>
      </section>

      <textarea id="userNote" placeholder="Optional note: what are you learning here?"></textarea>

      <section class="actions">
        <button id="startBtn">Start</button>
        <button id="screenshotBtn">Screenshot</button>
        <button id="saveBtn" class="primary">Save</button>
      </section>

      <section class="screenshots">
        <span>Screenshots</span>
        <strong id="screenshotCount">0</strong>
      </section>

      <details>
        <summary>Settings</summary>
        <label>
          Backend
          <input id="backendUrl" value="http://localhost:4177" />
        </label>
        <label>
          Obsidian REST URL
          <input id="obsidianUrl" value="http://127.0.0.1:27123" />
        </label>
        <label>
          Obsidian token
          <input id="obsidianToken" type="password" placeholder="Local REST API token" />
        </label>
        <label>
          Folders
          <input id="folders" value="Inbox, Learning, Ideas, Frameworks, Examples" />
        </label>
        <button id="saveSettingsBtn">Save settings</button>
      </details>

      <p id="message"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
